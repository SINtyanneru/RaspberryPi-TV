<!DOCTYPE html>
<HTML>
	<HEAD>
		<TITLE></TITLE>
		<STYLE>
			.QUEUE_ITEM {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 4px 0;
			}
			.QUEUE_ITEM IMG {
				width: 160px;
				height: 90px;
				object-fit: cover;
			}
			.QUEUE_ITEM.playing {
				background: rgba(48, 144, 255, 0.25);
			}
			.QUEUE_ITEM[draggable="true"] {
				cursor: grab;
			}
			.QUEUE_ITEM.dragging {
				opacity: 0.4;
			}
			.QUEUE_ITEM.drop_before {
				box-shadow: 0 -3px 0 rgba(48, 144, 255, 1);
			}
			.QUEUE_ITEM.drop_after {
				box-shadow: 0 3px 0 rgba(48, 144, 255, 1);
			}
		</STYLE>
	</HEAD>
	<BODY>
		<H1>Watch Together</H1>
		<INPUT TYPE="text" ID="URL"><BUTTON onclick="add_queue()">キューに追加</BUTTON>
		<DIV>
			<DIV ID="NOW_PLAYING"></DIV>
			<INPUT TYPE="range" ID="SEEK" MIN="0" MAX="0" VALUE="0" STEP="1000" STYLE="width: 80%">
			<SPAN ID="POSITION">0:00</SPAN> / <SPAN ID="DURATION">0:00</SPAN>
		</DIV>
		<DIV>
			<BUTTON onclick="control('prev')">前へ</BUTTON>
			<BUTTON onclick="control('rewind')">巻き戻し</BUTTON>
			<BUTTON onclick="control('play')">再生</BUTTON>
			<BUTTON onclick="control('pause')">一時停止</BUTTON>
			<BUTTON onclick="control('fast_forward')">早送り</BUTTON>
			<BUTTON onclick="control('next')">次へ</BUTTON>
			<BUTTON onclick="control('stop')">停止</BUTTON>
		</DIV>
		<DIV>
			字幕: <SELECT ID="SUBTITLE" onchange="change_subtitle()"></SELECT>
		</DIV>
		<DIV ID="QUEUE_LIST"></DIV>
	</BODY>
	<SCRIPT>
		const seek_bar = document.getElementById("SEEK");
		let seeking = false;
		let playing_index = -1;
		let drag_id = null;
		let drag_index = -1;
		let subtitle_key = "";

		//SSEで届いたキューの一覧を描画する(表示は上が最新・下が古い)
		function render_queue(result) {
			const queue_list = document.getElementById("QUEUE_LIST");
			queue_list.replaceChildren();

			const list_length = result.LIST.length;
			for (let i = 0; i < list_length; i++) {
				const item = result.LIST[list_length - 1 - i];
				const index = i;
				const queue_index = list_length - 1 - i;
				let item_div = document.createElement("DIV");
				item_div.className = "QUEUE_ITEM";
				item_div.draggable = true;

				let image = document.createElement("IMG");
				image.draggable = false;
				image.src = `/api/queue/${item.ID}/thumbnail`;
				image.onerror = function() {
					image.style.visibility = "hidden";
				};
				item_div.append(image);

				let text_div = document.createElement("DIV");

				let title_div = document.createElement("DIV");
				title_div.textContent = item.CONTENTS_TITLE;
				text_div.append(title_div);

				let author_div = document.createElement("DIV");
				author_div.textContent = item.CONTENTS_AUTHOR;
				text_div.append(author_div);

				item_div.append(text_div);

				let button_div = document.createElement("DIV");

				//画面の上はキューの後方、下は前方にあたる
				let up_button = document.createElement("BUTTON");
				up_button.textContent = "↑";
				up_button.onclick = function() {
					queue_move(item.ID, queue_index + 1);
				};
				button_div.append(up_button);

				let down_button = document.createElement("BUTTON");
				down_button.textContent = "↓";
				down_button.onclick = function() {
					queue_move(item.ID, queue_index - 1);
				};
				button_div.append(down_button);

				let delete_button = document.createElement("BUTTON");
				delete_button.textContent = "削除";
				delete_button.onclick = function() {
					queue_action(item.ID, "delete");
				};
				button_div.append(delete_button);

				item_div.append(button_div);

				item_div.addEventListener("dragstart", function(event) {
					drag_id = item.ID;
					drag_index = index;
					item_div.classList.add("dragging");
					event.dataTransfer.effectAllowed = "move";
				});

				item_div.addEventListener("dragend", function() {
					drag_id = null;
					drag_index = -1;
					item_div.classList.remove("dragging");
					clear_drop_marks();
				});

				item_div.addEventListener("dragover", function(event) {
					event.preventDefault();
					event.dataTransfer.dropEffect = "move";
					const rect = item_div.getBoundingClientRect();
					const after = (event.clientY - rect.top) > rect.height / 2;
					clear_drop_marks();
					item_div.classList.add(after ? "drop_after" : "drop_before");
				});

				item_div.addEventListener("dragleave", function() {
					item_div.classList.remove("drop_before");
					item_div.classList.remove("drop_after");
				});

				item_div.addEventListener("drop", function(event) {
					event.preventDefault();
					const rect = item_div.getBoundingClientRect();
					const after = (event.clientY - rect.top) > rect.height / 2;
					let target = index + (after ? 1 : 0);
					if (drag_index >= 0 && drag_index < target) {
						target--;
					}
					if (drag_id != null && target != drag_index) {
						//画面の位置からキューの位置へ直して送る
						queue_move(drag_id, list_length - 1 - target);
					}
					clear_drop_marks();
				});

				queue_list.append(item_div);
			}

			update_playing_mark();
		}

		//ドロップ位置の表示を消す
		function clear_drop_marks() {
			const queue_list = document.getElementById("QUEUE_LIST");
			for (let i = 0; i < queue_list.children.length; i++) {
				queue_list.children[i].classList.remove("drop_before");
				queue_list.children[i].classList.remove("drop_after");
			}
		}

		//再生中の行にplayingクラスを付ける
		function update_playing_mark() {
			const queue_list = document.getElementById("QUEUE_LIST");
			for (let i = 0; i < queue_list.children.length; i++) {
				//表示は上が最新なので、キューの位置は逆向きに数える
				if (queue_list.children.length - 1 - i == playing_index) {
					queue_list.children[i].classList.add("playing");
				} else {
					queue_list.children[i].classList.remove("playing");
				}
			}
		}

		//ドラッグ中はSSEの値で上書きしない
		seek_bar.addEventListener("input", function() {
			seeking = true;
			document.getElementById("POSITION").textContent = format_time(Number(seek_bar.value));
		});

		//ドラッグを離したらシークする
		seek_bar.addEventListener("change", async function() {
			await fetch("/api/seek", {
				method: "POST",
				body: JSON.stringify(
					{
						"position_ms": Number(seek_bar.value)
					}
				)
			});
			seeking = false;
		});

		const source = new EventSource("/api/sse");

		source.addEventListener("playtime", function(event) {
			const data = JSON.parse(event.data);
			document.getElementById("NOW_PLAYING").textContent = data.playing ? data.title : "";
			const new_playing_index = data.playing ? data.index : -1;
			if (new_playing_index != playing_index) {
				playing_index = new_playing_index;
				update_playing_mark();
			}
			update_subtitle_selector(data);
			seek_bar.max = data.duration_ms;
			document.getElementById("DURATION").textContent = format_time(data.duration_ms);
			if (!seeking) {
				seek_bar.value = data.position_ms;
				document.getElementById("POSITION").textContent = format_time(data.position_ms);
			}
		});

		source.addEventListener("playqueue", function(event) {
			render_queue(JSON.parse(event.data));
		});

		async function control(name) {
			await fetch("/api/" + name, {
				method: "POST"
			});
		}

		//キューの編集(結果はSSEのplayqueueで反映される)
		async function queue_action(id, action) {
			await fetch("/api/queue/" + id + "/" + action, {
				method: "POST"
			});
		}

		//字幕セレクタをSSEの内容に合わせる
		function update_subtitle_selector(data) {
			const select = document.getElementById("SUBTITLE");
			const key = JSON.stringify(data.subtitles);
			if (key != subtitle_key) {
				subtitle_key = key;
				select.replaceChildren();
				let none_option = document.createElement("OPTION");
				none_option.value = "-1";
				none_option.textContent = "なし";
				select.append(none_option);
				for (const sub of data.subtitles) {
					let option = document.createElement("OPTION");
					option.value = String(sub.INDEX);
					if (sub.TITLE != "") {
						option.textContent = sub.TITLE;
					} else if (sub.LANGUAGE != "") {
						option.textContent = sub.LANGUAGE;
					} else {
						option.textContent = "字幕" + (sub.INDEX + 1);
					}
					select.append(option);
				}
			}
			if (document.activeElement != select) {
				select.value = String(data.subtitle_selected);
			}
		}

		async function change_subtitle() {
			const select = document.getElementById("SUBTITLE");
			await fetch("/api/subtitle", {
				method: "POST",
				body: JSON.stringify(
					{
						"INDEX": Number(select.value)
					}
				)
			});
		}

		//ドラッグ&ドロップでの移動(結果はSSEのplayqueueで反映される)
		async function queue_move(id, index) {
			await fetch("/api/queue/" + id + "/move", {
				method: "POST",
				body: JSON.stringify(
					{
						"INDEX": index
					}
				)
			});
		}

		function format_time(ms) {
			const sec = Math.floor(ms / 1000);
			return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
		}

		async function add_queue() {
			const url = document.getElementById("URL").value;
			let ajax = await fetch("/api/queue", {
				method: "POST",
				body: JSON.stringify(
					{
						"URL": url
					}
				)
			})
		}
	</SCRIPT>
</HTML>
